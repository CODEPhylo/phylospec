name: Pull Request Checks

on: pull_request

jobs:
  pull_request_checks:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: set up jdk x64
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          architecture: x64
          cache: maven

      - name: run formatter
        run: sh scripts/format.sh

      - name: run tests
        run: mvn -B -pl core/java,integrations/beast3/java -am test
